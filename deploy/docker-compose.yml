name: lmutracker

# Deploy do LMUTracker: o scanner (worker) e o site (lmutracker-api = Api + front).
# Segredos ficam no .env ao lado (NUNCA versionado). Veja .env.example.
#
# BANCO: reusa o SQL Server que JÁ roda para o GameTracker (o VPS é de 4GB; um segundo SQL Server
# estouraria a RAM). Os serviços entram na rede do GameTracker e falam com o `db` por dentro dela, num
# banco separado `LmuTracker` — que o worker cria/migra no start (EF MigrateAsync).
#
# NOMES NA REDE COMPARTILHADA: cada serviço vira um nome de DNS na rede do GameTracker. NUNCA chame um
# serviço daqui de `api`, `web` ou `db` — o Caddy do GameTracker resolveria `api` também para o nosso
# contêiner e mandaria parte do tráfego do gamestrackers.com para cá.
#
# A rede externa abaixo é a do compose do GameTracker (name: gametracker -> rede gametracker_default).

services:
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: ${LMU_DB}
      RaceOs__TicketProvider: steamkit
      RaceOs__SteamKit__Username: ${STEAM_USERNAME}
      RaceOs__SteamKit__SessionStorePath: /data/steam-session.json
      Scanner__IntervalSeconds: "120"
      AppReleases__Directory: /app/data/apk   # comando publish-release (App Android)
    env_file: .env
    volumes:
      - steam-session:/data   # refresh token da conta de serviço (gerado pelo bootstrap steam-login)
      - /root/lmutracker-data/apk:/app/data/apk:ro   # o publish-release confere se o APK existe
    networks:
      - gametracker
    restart: unless-stopped

  # Site: Api + front na porta 8080, sem porta publicada. Quem expõe é o Caddy do GameTracker, pelo bloco
  # lmutracker.{$DOMAIN} -> lmutracker-api:8080 (mesmo padrão do financas/deuquanto).
  lmutracker-api:
    build:
      context: ..
      dockerfile: Dockerfile.site
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${LMU_DB}
      Jwt__SecretFile: /data/jwt.key        # gerado na 1ª subida e guardado no volume
      Site__BaseUrl: https://lmutracker.gamestrackers.com
      Tickets__UploadsPath: /data/uploads   # prints dos chamados (no volume, sobrevive ao deploy)
      # APKs do app Android. A versão liberada fica no banco (AppReleases); ver README → App Android.
      AppReleases__Directory: /app/data/apk
    volumes:
      - api-data:/data
      # Fora da pasta do repositório: o deploy faz `git reset --hard` lá.
      - /root/lmutracker-data/apk:/app/data/apk:ro
    networks:
      - gametracker
    restart: unless-stopped

networks:
  gametracker:
    external: true
    name: gametracker_default

volumes:
  steam-session:
  api-data:
