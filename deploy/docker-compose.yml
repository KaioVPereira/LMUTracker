name: lmutracker

# Deploy do LMUTracker: só o site (lmutracker-api), em modo encerrado — sem banco nem segredos.
#
# NOMES NA REDE COMPARTILHADA: cada serviço vira um nome de DNS na rede do GameTracker. NUNCA chame um
# serviço daqui de `api`, `web` ou `db` — o Caddy do GameTracker resolveria `api` também para o nosso
# contêiner e mandaria parte do tráfego do gamestrackers.com para cá.
#
# A rede externa abaixo é a do compose do GameTracker (name: gametracker -> rede gametracker_default).

services:
  # SITE ENCERRADO (2026-11-02): a RaceControl bloqueou o IP do servidor. O scanner (worker) saiu e o banco
  # LmuTracker foi apagado do SQL do GameTracker (backup local). Sobrou só o site, que serve a página de encerramento
  # e o aviso de versão nova do app Android (APK em /root/lmutracker-data/apk). O deploy usa --remove-orphans para
  # tirar o contêiner antigo do worker.
  #
  # Exposto pelo Caddy do GameTracker, bloco lmutracker.{$DOMAIN} -> lmutracker-api:8080.
  lmutracker-api:
    build:
      context: ..
      dockerfile: Dockerfile.site
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AppReleases__Directory: /app/data/apk
    volumes:
      # Fora da pasta do repositório: o deploy faz `git reset --hard` lá.
      - /root/lmutracker-data/apk:/app/data/apk:ro
    networks:
      - gametracker
    restart: unless-stopped

networks:
  gametracker:
    external: true
    name: gametracker_default

